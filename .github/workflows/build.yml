# Checks every push, and builds the Windows installer (.exe) and Android
# package (.apk) for distribution. Run manually, or push a tag like v1.0.0:
# a tag builds both and publishes them as a GitHub release.
name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      android:
        description: "Also build the Android APK"
        type: boolean
        default: false
      release:
        description: "Publish a GitHub release with this tag (for example v1.0.0) from this commit"
        type: string
        default: ""

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - uses: dtolnay/rust-toolchain@stable
        with: { components: clippy }
      - uses: Swatinem/rust-cache@v2
      - name: System libraries for Tauri
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libayatana-appindicator3-dev libxdo-dev
      - run: npm ci
      - run: npm run i18n:check
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  windows-exe:
    needs: check
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: npm ci
      - run: npx tauri build --bundles nsis
        env:
          # Google Calendar sign-in (desktop OAuth client). Read at compile time by src-tauri.
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
      - uses: actions/upload-artifact@v4
        with:
          name: NoSidian-windows-exe
          path: target/release/bundle/nsis/*.exe

  android-apk:
    needs: check
    # Built when asked for by hand, and for every release tag.
    if: (github.event_name == 'workflow_dispatch' && (inputs.android || inputs.release != '')) || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    env:
      NDK_VERSION: 27.2.12479018
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      # The runner image ships the Android SDK; only the NDK needs installing.
      - name: Android NDK
        run: |
          SDKM="$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin | sort -V | tail -1)/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" --install "ndk;${NDK_VERSION}" "platforms;android-35" "build-tools;35.0.0"
          echo "NDK_HOME=$ANDROID_HOME/ndk/${NDK_VERSION}" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi
      - uses: Swatinem/rust-cache@v2
      - run: npm ci
      - run: npx tauri android init --ci
      - name: Build APK
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          APK_DIR=src-tauri/gen/android/app/build/outputs/apk/universal/release
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > release.jks
            KS=release.jks; PASS="$KEYSTORE_PASSWORD"; ALIAS="$KEY_ALIAS"
          else
            # No signing key configured yet: a throwaway key, installable for testing.
            keytool -genkeypair -v -keystore release.jks -storepass nosidian-test -keypass nosidian-test \
              -alias nosidian -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=NoSidian" > /dev/null
            KS=release.jks; PASS=nosidian-test; ALIAS=nosidian
          fi
          # Sign the release build found in APK_DIR into the named APK.
          sign() {
            for f in "$APK_DIR"/*-unsigned.apk; do
              "$BT/zipalign" -f 4 "$f" aligned.apk
              "$BT/apksigner" sign --ks "$KS" --ks-pass "pass:$PASS" --ks-key-alias "$ALIAS" --key-pass "pass:$PASS" --out "$1" aligned.apk
            done
          }
          # Main build: 64-bit ARM phones only, small enough to download and install.
          npx tauri android build --apk --target aarch64 --ci
          sign NoSidian-android.apk
          # Older phones: 32-bit ARM only.
          rm -rf "$APK_DIR"
          npx tauri android build --apk --target armv7 --ci
          sign NoSidian-android-old.apk
      - uses: actions/upload-artifact@v4
        with:
          name: NoSidian-android-apk
          path: |
            NoSidian-android.apk
            NoSidian-android-old.apk

  release:
    needs: [windows-exe, android-apk]
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.release != '')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          tag_name: ${{ inputs.release || github.ref_name }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          body: |
            **NoSidian-android-old.apk** is for older Android phones only (32-bit ARM). It is a separate build from NoSidian-android.apk. Phones from the last few years should use NoSidian-android.apk.

            **NoSidian-android-old.apk** مخصوص گوشی‌های قدیمی است (معماری ۳۲ بیتی ARM). این نسخه جدا از NoSidian-android.apk ساخته شده؛ گوشی‌های جدید همان NoSidian-android.apk را نصب کنند.
