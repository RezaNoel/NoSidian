# Checks every push, and builds the Windows installer (.exe) and Android
# package (.apk) for distribution. Run manually or by pushing a tag like v0.1.0.
name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      android:
        description: "Also build the Android APK (paused for now: Windows only)"
        type: boolean
        default: false

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - uses: dtolnay/rust-toolchain@stable
        with: { components: clippy }
      - uses: Swatinem/rust-cache@v2
      - name: System libraries for Tauri
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libayatana-appindicator3-dev libxdo-dev
      - run: npm ci
      - run: npm run i18n:check
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  windows-exe:
    needs: check
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: npm ci
      - run: npx tauri build --bundles nsis
        env:
          # Google Calendar sign-in (desktop OAuth client). Read at compile time by src-tauri.
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
      - uses: actions/upload-artifact@v4
        with:
          name: NoSidian-windows-exe
          path: target/release/bundle/nsis/*.exe

  android-apk:
    needs: check
    # Android is paused until further notice; run only when asked for explicitly.
    if: github.event_name == 'workflow_dispatch' && inputs.android
    runs-on: ubuntu-24.04
    env:
      NDK_VERSION: 27.2.12479018
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      # The runner image ships the Android SDK; only the NDK needs installing.
      - name: Android NDK
        run: |
          SDKM="$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin | sort -V | tail -1)/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" --install "ndk;${NDK_VERSION}" "platforms;android-35" "build-tools;35.0.0"
          echo "NDK_HOME=$ANDROID_HOME/ndk/${NDK_VERSION}" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android
      - uses: Swatinem/rust-cache@v2
      - run: npm ci
      - run: npx tauri android init --ci
      - name: Build APK
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            npx tauri android build --apk --ci
            echo "$KEYSTORE_B64" | base64 -d > release.jks
            BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
            for f in src-tauri/gen/android/app/build/outputs/apk/universal/release/*-unsigned.apk; do
              "$BT/zipalign" -f 4 "$f" aligned.apk
              "$BT/apksigner" sign --ks release.jks --ks-pass env:KEYSTORE_PASSWORD --ks-key-alias "$KEY_ALIAS" --out NoSidian.apk aligned.apk
            done
          else
            # No signing key configured yet: debug-signed APK, installable for testing.
            npx tauri android build --apk --debug --ci
            cp src-tauri/gen/android/app/build/outputs/apk/universal/debug/*.apk NoSidian-debug.apk
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: NoSidian-android-apk
          path: NoSidian*.apk
