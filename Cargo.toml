[workspace]
resolver = "2"
members = ["crates/nosidian-core", "crates/nosidian-i18n", "src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
rust-version = "1.80"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
uuid = { version = "1", features = ["v4", "serde"] }
tempfile = "3"
nosidian-core = { path = "crates/nosidian-core" }

[profile.release]
lto = true
codegen-units = 1
strip = true
